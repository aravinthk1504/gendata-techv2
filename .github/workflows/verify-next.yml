name: Next.js build and route checks
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check Next.js production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Verify English and German server-rendered content
        shell: bash
        run: |
          npm run start > /tmp/gendata-next.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for attempt in {1..30}; do
            curl -fsS http://localhost:3000/en -o /tmp/home-en.html && break || sleep 1
          done
          curl -fsS http://localhost:3000/de -o /tmp/home-de.html
          curl -fsS http://localhost:3000/en/about -o /tmp/about-en.html
          curl -fsS http://localhost:3000/de/about -o /tmp/about-de.html
          grep -q 'AI built for' /tmp/home-en.html
          grep -q 'real-world impact' /tmp/home-en.html
          grep -q 'AI Model Development' /tmp/home-en.html
          grep -q 'AI Automation' /tmp/home-en.html
          grep -q 'GenData LMS' /tmp/home-en.html
          grep -q 'GenData Tech' /tmp/home-de.html
          grep -q 'About GenData Tech' /tmp/about-en.html || grep -q 'Building' /tmp/about-en.html
          test -s /tmp/about-de.html
