name: Next.js verification
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run deterministic unit tests
        run: node --test tests/*.test.mjs
      - name: Check Next.js production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      # CI intentionally has no Firebase production credentials. Public home
      # and blog pages require Firestore, so test those after deployment instead.
      - name: Smoke test static-content SSR pages
        shell: bash
        run: |
          npm run start > /tmp/gendata-next.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://localhost:3000/en/about -o /tmp/about-en.html; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:3000/de/about -o /tmp/about-de.html
          test -s /tmp/about-en.html
          test -s /tmp/about-de.html
          grep -q 'GenData Tech' /tmp/about-en.html
          grep -q 'GenData Tech' /tmp/about-de.html
